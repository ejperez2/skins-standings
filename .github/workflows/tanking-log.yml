name: Log tanking-study data

# Daily data collection for the tanking study (analysis/tanking). Not part of the webpage.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'   # ~7-8 AM Central, after last night's games are final

permissions:
  contents: write

concurrency:
  group: tanking-log

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests lxml
      - run: python analysis/tanking/log_daily.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/tanking/data
          git diff --staged --quiet && exit 0
          git commit -m "Log tanking-study data [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 15))
          done
          exit 1
