name: Crafted fetch test (temporary)
# Crafted NBA allowed a once-daily scrape of its public projections (email, Oct 27, 2026) and suggested
# adjusting request headers or using a proxy for the Cloudflare 403 seen from GitHub Actions.
on:
  push:
    branches: [ccr-e9964a82-xl5jpj]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch craftednba.com from a GitHub runner
        run: |
          probe() {
            label="$1"; shift
            code=$(curl -sS -m 20 -o body.txt -w "%{http_code}" "$@")
            echo "=== $label -> $code ($(wc -c < body.txt) bytes)"
            grep -o -i -E '<title>[^<]*</title>|error code:? *[0-9]+|Just a moment|Attention Required|"success":true' body.txt | sort -u | head -5
          }
          API=https://craftednba.com/api/team-projections
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          probe "api, current request" -A "Mozilla/5.0" "$API"
          probe "api, browser headers" -A "$UA" -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" -H "Referer: https://craftednba.com/season-projections" "$API"
          probe "page, browser headers" -A "$UA" -H "Accept: text/html,application/xhtml+xml" \
            -H "Accept-Language: en-US,en;q=0.9" https://craftednba.com/season-projections
