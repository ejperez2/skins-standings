name: Render and Publish NBA Stats

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Central time: every 4 hours at 6 AM, 10 AM, 2 PM, 6 PM, then hourly 8 PM - 2 AM
  schedule:
    - cron: '0 1-7,11,15,19,23 * * *'   # CDT (UTC-5)
    - cron: '0 0,2-8,12,16,20 * * *'    # CST (UTC-6)

permissions:
  contents: write

jobs:
  # GitHub schedules run on UTC; Chicago is UTC-5 (CDT) or UTC-6 (CST). Each Central time has a CDT
  # and a CST cron line above - this job lets through only the one that matches today's clock.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          run=true
          zone=$(TZ=America/Chicago date +%Z)
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              "0 1-7,11,15,19,23 * * *") [ "$zone" = "CDT" ] || run=false ;;
              "0 0,2-8,12,16,20 * * *") [ "$zone" = "CST" ] || run=false ;;
            esac
          fi
          echo "event=$EVENT cron='$CRON' chicago=$zone -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A normal run takes 4-10 min; a hung runner (Oct 27, 2026: stuck in Set up R) otherwise holds for 6 hours
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-r apt-installs devscripts etc., whose Recommends add ~175 packages / 33 MB we never use.
      # On a slow Azure mirror (Nov 5, 2026) that download alone blew the 15-minute Set up R timeout.
      - name: Skip apt Recommends
        run: echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99no-recommends

      # Cache the apt .debs (~90 MB: setup-r's tools + the -dev libraries the R packages need) so a
      # slow Ubuntu mirror only matters for packages whose version changed since the last cache.
      # apt skips any download whose .deb (same version + checksum) is already in its archives dir.
      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          # Never matches exactly; restore-keys picks the newest saved cache
          key: apt-debs-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-debs-${{ runner.os }}-${{ runner.arch }}-

      - name: Seed apt with cached packages
        run: |
          printf 'APT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99keep-debs
          if ls ~/apt-debs/*.deb >/dev/null 2>&1; then
            sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/
            echo "Seeded $(ls ~/apt-debs/*.deb | wc -l) cached .debs"
          fi

      # SPEED: Keep using binaries to maintain that ~2 minute build time
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          r-version: 'latest'
          use-public-rspm: true 

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rmarkdown
            any::knitr
            any::pacman
            any::httr
            any::jsonlite
            any::rvest
            any::dplyr
            any::tidyr
            any::kableExtra
            any::tibble
            any::stringr
            any::ggplot2
            any::scales

      # Save the .debs only when the set changed (new versions), so we don't store a copy every run
      - name: Collect apt packages for cache
        id: apt-debs
        run: |
          sudo apt-get autoclean -y   # drop .debs for versions the mirror no longer serves
          rm -rf ~/apt-debs && mkdir -p ~/apt-debs
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          echo "Collected $(ls ~/apt-debs | wc -l) .debs, $(du -sh ~/apt-debs | cut -f1)"
          echo "hash=$(ls ~/apt-debs | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save apt package cache
        if: steps.apt-cache.outputs.cache-matched-key != format('apt-debs-{0}-{1}-{2}', runner.os, runner.arch, steps.apt-debs.outputs.hash)
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-debs.outputs.hash }}

      - name: Render Quarto Document
        run: |
          # HYGIENE: Render to '_site' so we don't mix code with the website
          quarto render index.qmd --to html --output-dir _site
          
          # SAFETY: Ensure GitHub doesn't ignore the folder
          touch _site/.nojekyll

          # Past seasons: publish each archive/<season>/index.html at /<season>/
          for d in archive/*/; do
            if [ -f "${d}index.html" ]; then
              mkdir -p "_site/$(basename "$d")" && cp "${d}index.html" "_site/$(basename "$d")/index.html"
            fi
          done

      - name: Commit standings history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Files may not exist yet (standings_history.csv is only written after the draft)
          for f in standings_history.csv team_vegas_history.csv team_projection_history.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # Only the staged CSVs matter: the render leaves unrelated unstaged changes (e.g. index.html deleted),
          # so checking the whole working tree made `git commit` run with nothing staged and exit 1.
          git diff --staged --quiet || git commit -m "Update standings history [skip ci]"
          git push
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # CRITICAL: Only upload the clean website folder
          publish_dir: _site
          # CLEANUP: Wipes the branch clean every time so no junk accumulates
          force_orphan: true
